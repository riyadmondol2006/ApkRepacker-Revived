import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.process.ExecOperations

import javax.inject.Inject

plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.riyadm.apkrepacker'
    compileSdk = rootProject.ext.compileSdkVersion
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId = "com.riyadm.apkrepacker"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        // The release workflow passes the next patch version as -PappVersionName/-PappVersionCode
        // (docs/RELEASING.md). The name below is the minimum: raise it for a new major or minor.
        versionName = (project.findProperty('appVersionName') ?: '1.0.6').toString()
        // major * 1000000 + minor * 1000 + patch: 1.0.6 -> 1000006 (above the old 42, always rising).
        versionCode = project.hasProperty('appVersionCode')
                ? Integer.parseInt(project.property('appVersionCode').toString())
                : (versionName.findAll(/\d+/)*.toInteger() + [0, 0, 0]).take(3).with { it[0] * 1000000 + it[1] * 1000 + it[2] }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Shown in decode/build logs and written to apktool.yml.
        buildConfigField "String", "APKTOOL_VERSION", "\"${libs.versions.apktool.get()}\""
    }

    // Release signing comes from the environment only, so no key ever lives in the repository:
    // the GitHub Actions release workflow sets these from repository secrets (docs/RELEASING.md).
    // Without them (a normal local build) the release APK is simply left unsigned.
    def releaseStoreFile = providers.environmentVariable("SIGNING_STORE_FILE").orNull
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile = file(releaseStoreFile)
                storePassword = providers.environmentVariable("SIGNING_STORE_PASSWORD").orNull
                keyAlias = providers.environmentVariable("SIGNING_KEY_ALIAS").orNull
                keyPassword = providers.environmentVariable("SIGNING_KEY_PASSWORD").orNull
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStoreFile) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    compileOptions {
        // Backports java.nio.file & friends to API < 26 for jadx, smali and commons-io.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/versions/9/module-info.class', 'module-info.class',
                         // apktool-lib's desktop aapt2 binaries; the app ships its own (jniLibs/*/libaapt2.so).
                         // Keep prebuilt/android-framework.jar: apktool extracts it as framework 1.apk.
                         'prebuilt/linux/**', 'prebuilt/macosx/**', 'prebuilt/windows/**']
        }
        jniLibs {
            // libaapt2.so is an executable, not a JNI library: it has to be extracted to
            // nativeLibraryDir so apktool can run it.
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds = false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError = false
    }
}

base {
    archivesName = "ApkRepackerRevived-v${android.defaultConfig.versionName}(${android.defaultConfig.versionCode})"
}

/*
 * libpatchscan.so: the native patch-rule pre-filter, built from the Rust crate in native/patchscan
 * for every ABI the app ships. Needs cargo (rustup) with the three Android targets and an NDK for
 * its clang linker (docs/RELEASING.md). -PskipRust=true packages the app without it; the app then
 * falls back to its Java scanner. CI never passes it, so a release can't silently lose the library.
 */
abstract class CargoBuildPatchScan extends DefaultTask {
    // ABI -> Rust target triple, and the NDK clang prefix for that triple.
    static final Map<String, String> TRIPLES = [
        'arm64-v8a'  : 'aarch64-linux-android',
        'armeabi-v7a': 'armv7-linux-androideabi',
        'x86_64'     : 'x86_64-linux-android',
    ]
    static final Map<String, String> CLANG = [
        'aarch64-linux-android'  : 'aarch64-linux-android',
        'armv7-linux-androideabi': 'armv7a-linux-androideabi',
        'x86_64-linux-android'   : 'x86_64-linux-android',
    ]

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getCrateFiles()

    @Internal
    abstract DirectoryProperty getCrateDir()

    @Input
    abstract Property<Integer> getMinSdk()

    @Input
    abstract Property<Boolean> getSkip()

    // Where to look for the NDK when no ANDROID_NDK_* variable is set (<sdk>/ndk/<version>).
    @Internal
    abstract Property<String> getSdkDir()

    @Internal
    abstract DirectoryProperty getCargoTargetDir()

    @OutputDirectory
    abstract DirectoryProperty getJniLibsDir()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void build() {
        File out = jniLibsDir.get().asFile
        out.deleteDir()
        out.mkdirs()
        if (skip.get()) {
            logger.warn("w: -PskipRust=true: building without libpatchscan.so (the app uses its Java scanner)")
            return
        }

        String hostTag = System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64' : 'linux-x86_64'
        String rustTargets = TRIPLES.values().join(' ')
        String cargo = findCargo()
        if (cargo == null) {
            throw new GradleException("cargo was not found (on PATH or in ~/.cargo/bin), so libpatchscan.so can't be built.\n" +
                    "Install Rust from https://rustup.rs, then: rustup target add $rustTargets\n" +
                    "Or build without the native scanner: -PskipRust=true")
        }
        File ndk = findNdk(hostTag)
        if (ndk == null) {
            throw new GradleException("No Android NDK was found, so libpatchscan.so can't be built.\n" +
                    "Install one (Android Studio > SDK Manager > SDK Tools > NDK, or sdkmanager \"ndk;27.0.12077973\") " +
                    "or set ANDROID_NDK_HOME.\nOr build without the native scanner: -PskipRust=true")
        }
        File bin = new File(ndk, "toolchains/llvm/prebuilt/$hostTag/bin")
        logger.lifecycle("cargo: $cargo, NDK: $ndk")

        Map<String, String> env = [:]
        // A rustup proxy run by full path still needs rustc next to it.
        env['PATH'] = new File(cargo).parent + File.pathSeparator + (System.getenv('PATH') ?: '')
        TRIPLES.values().each { triple ->
            String clang = new File(bin, "${CLANG[triple]}${minSdk.get()}-clang").absolutePath
            String ar = new File(bin, 'llvm-ar').absolutePath
            String key = triple.replace('-', '_')
            env["CARGO_TARGET_${key.toUpperCase()}_LINKER".toString()] = clang
            env["CC_$key".toString()] = clang
            env["AR_$key".toString()] = ar
        }

        List<String> args = [cargo, 'build', '--release', '--locked',
                             '--manifest-path', crateDir.file('Cargo.toml').get().asFile.absolutePath,
                             '--target-dir', cargoTargetDir.get().asFile.absolutePath]
        TRIPLES.values().each { args += ['--target', it] }
        try {
            execOperations.exec {
                it.commandLine(args)
                it.workingDir(crateDir.get().asFile)
                it.environment(env)
            }
        } catch (Exception e) {
            throw new GradleException("cargo build failed for libpatchscan.so (see the output above). " +
                    "Missing targets? rustup target add $rustTargets  (or -PskipRust=true to build without it)", e)
        }

        TRIPLES.each { abi, triple ->
            File so = new File(cargoTargetDir.get().asFile, "$triple/release/libpatchscan.so")
            if (!so.isFile()) {
                throw new GradleException("cargo finished but $so is missing")
            }
            File dest = new File(out, "$abi/libpatchscan.so")
            dest.parentFile.mkdirs()
            java.nio.file.Files.copy(so.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }

    private static String findCargo() {
        String exe = System.getProperty('os.name').toLowerCase().contains('windows') ? 'cargo.exe' : 'cargo'
        List<File> dirs = (System.getenv('PATH') ?: '').split(File.pathSeparator).findAll { it }.collect { new File(it) }
        if (System.getenv('CARGO_HOME')) {
            dirs << new File(System.getenv('CARGO_HOME'), 'bin')
        }
        dirs << new File(System.getProperty('user.home'), '.cargo/bin')
        File found = dirs.collect { new File(it, exe) }.find { it.isFile() && it.canExecute() }
        return found?.absolutePath
    }

    private File findNdk(String hostTag) {
        Closure<Boolean> usable = { File dir -> dir != null && new File(dir, "toolchains/llvm/prebuilt/$hostTag/bin/llvm-ar").isFile() }
        for (String name : ['ANDROID_NDK_HOME', 'ANDROID_NDK_LATEST_HOME', 'ANDROID_NDK_ROOT']) {
            String value = System.getenv(name)
            if (value) {
                if (usable(new File(value))) {
                    return new File(value)
                }
                logger.warn("w: $name=$value is not a usable NDK, ignoring it")
            }
        }
        List<String> sdks = [sdkDir.getOrNull(), System.getenv('ANDROID_HOME'), System.getenv('ANDROID_SDK_ROOT')].findAll { it }
        for (String sdk : sdks) {
            File[] versions = new File(sdk, 'ndk').listFiles()
            File newest = (versions ?: new File[0]).findAll { usable(it) }.max { File a, File b -> compareVersions(a.name, b.name) }
            if (newest != null) {
                return newest
            }
        }
        return null
    }

    private static int compareVersions(String a, String b) {
        List<Integer> x = a.findAll(/\d+/)*.toInteger(), y = b.findAll(/\d+/)*.toInteger()
        for (int i = 0; i < Math.max(x.size(), y.size()); i++) {
            int c = (i < x.size() ? x[i] : 0) <=> (i < y.size() ? y[i] : 0)
            if (c != 0) return c
        }
        return 0
    }
}

def patchScanCrate = rootProject.layout.projectDirectory.dir('native/patchscan')
def cargoBuildPatchScan = tasks.register('cargoBuildPatchScan', CargoBuildPatchScan) {
    description = 'Builds libpatchscan.so (native/patchscan) for every ABI the app ships.'
    crateDir = patchScanCrate
    crateFiles.from(fileTree(patchScanCrate) { exclude 'target/**' })
    minSdk = rootProject.ext.minSdkVersion as Integer
    skip = providers.gradleProperty('skipRust').map { it.toBoolean() }.orElse(false)
    sdkDir = androidComponents.sdkComponents.sdkDirectory.map { it.asFile.absolutePath }
    cargoTargetDir = layout.buildDirectory.dir('rust/target')
    jniLibsDir = layout.buildDirectory.dir('rust/jniLibs')
}
// Packaged next to src/main/jniLibs (libaapt2.so). The source set API takes a plain directory, so
// the merge tasks depend on the cargo task explicitly.
android.sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('rust/jniLibs').get().asFile)
tasks.matching { it.name ==~ /merge\w*JniLibFolders/ }.configureEach {
    dependsOn cargoBuildPatchScan
}

// ARSCLib (AntiSplit) without its desktop-only parts: the Android framework tables and its own
// copies of android.* / org.xmlpull.* classes, which the device already provides. See libs/arsclib.
def arscLibJar = tasks.register('arscLibJar', Jar) {
    from(zipTree(file('libs/arsclib/ARSCLib-1.4.0.jar'))) {
        exclude 'frameworks/**', 'android/**', 'org/xmlpull/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
    archiveFileName = 'arsclib-android.jar'
    destinationDirectory = layout.buildDirectory.dir('arsclib')
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs.nio

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files(arscLibJar)
    // apktool 3 (decode/build). Android ships org.xmlpull.v1 itself.
    implementation(libs.apktool.lib) {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation project(':common')
    implementation project(':colorpicker')
    implementation project(':expandablerecyclerview')
    implementation project(':photoview')
    implementation project(':vectormaster')
    implementation project(':codeeditor')
    //kotlin
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    //androidx
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.documentfile

    //mvvm
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.extensions

    //material design
    implementation libs.google.material
    implementation libs.androidx.dynamicanimation

    //google utility lib
    implementation libs.guava
    implementation libs.gson
    //smali
    implementation libs.smali
    implementation libs.smali.baksmali
    //jadx (smali -> java)
    implementation libs.jadx.core
    implementation libs.jadx.dex.input
    implementation libs.jadx.smali.input
    //apk signing
    implementation libs.apksig
    //commons io
    implementation libs.commons.io

    implementation libs.glide
    implementation libs.fastscroll
    implementation libs.systemuihelper
    implementation libs.licensesdialog
    implementation libs.jetbrains.annotations
    implementation libs.universal.image.loader

    // tests
    testImplementation libs.junit
    androidTestImplementation libs.bundles.android.test
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
}

/*
 * apktool-lib targets desktop JVMs. Two of its classes use APIs that Android lacks:
 *  - ResNinePatchStreamDecoder draws 9-patch borders with java.awt/javax.imageio;
 *  - brut.xml.XmlUtils sets JAXP features that Android's DocumentBuilderFactory rejects, which
 *    silently disables --debuggable, --net-sec-conf and some manifest fixes.
 * The app ships Android versions of both (src/main/java/brut/...), so the originals are stripped
 * from the dependency jars here, together with the desktop aapt2 binaries.
 */
abstract class StripApktoolDesktopClasses implements TransformAction<TransformParameters.None> {
    private static final Map<String, List<String>> STRIPPED = [
        'apktool-lib-': ['brut/androlib/res/decoder/ResNinePatchStreamDecoder.class',
                         'prebuilt/linux/', 'prebuilt/macosx/', 'prebuilt/windows/'],
        'brut.j.xml-' : ['brut/xml/XmlUtils.class', 'brut/xml/XmlUtils$'],
    ]

    @InputArtifact
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        File input = inputArtifact.get().asFile
        String prefix = STRIPPED.keySet().find { input.name.startsWith(it) }
        if (prefix == null || !input.isFile()) {
            outputs.file(inputArtifact)
            return
        }
        List<String> stripped = STRIPPED[prefix]
        File output = outputs.file("android-" + input.name)
        new java.util.zip.ZipFile(input).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(output)).withCloseable { out ->
                zip.entries().each { java.util.zip.ZipEntry entry ->
                    if (stripped.any { entry.name.startsWith(it) }) {
                        return
                    }
                    out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    if (!entry.directory) {
                        zip.getInputStream(entry).withCloseable { out << it }
                    }
                    out.closeEntry()
                }
            }
        }
    }
}

def apktoolStripped = Attribute.of('com.riyadm.apkrepacker.apktool-stripped', Boolean)
dependencies {
    attributesSchema {
        attribute(apktoolStripped)
    }
    artifactTypes.maybeCreate('jar').attributes.attribute(apktoolStripped, false)
    registerTransform(StripApktoolDesktopClasses) {
        from.attribute(apktoolStripped, false).attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
        to.attribute(apktoolStripped, true).attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
    }
}
configurations.configureEach {
    if (name.endsWith('CompileClasspath') || name.endsWith('RuntimeClasspath')) {
        attributes.attribute(apktoolStripped, true)
    }
}
