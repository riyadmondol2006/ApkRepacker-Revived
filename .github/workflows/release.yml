name: Build and release

# Every push to main builds a signed release APK and publishes it as a GitHub Release.
# Setup (one time, about five minutes): docs/RELEASING.md

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases are published one at a time and never cancelled half-way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the release and its tag

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check the signing secrets exist
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Add these repository secrets:$missing  (see docs/RELEASING.md)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history, for the release notes
          persist-credentials: false   # the build scripts don't need the token on disk

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image already has the Android SDK and sdkmanager. Accepting the licenses lets
      # Gradle download any platform or build-tools version the project asks for.
      - name: Accept the Android SDK licenses
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check the signing key opens
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          # A pasted secret often carries a stray space, line break or quotes: clean those off.
          alias_clean=$(printf '%s' "$SIGNING_KEY_ALIAS" | tr -d '\r\n' | sed -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*\$//")
          if keytool -list -keystore "$SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" \
                 -alias "$alias_clean" > "$RUNNER_TEMP/keytool.txt" 2>&1; then
            if [ "$alias_clean" != "$SIGNING_KEY_ALIAS" ]; then
              echo "::warning title=SIGNING_KEY_ALIAS had stray characters::Cleaned it (length ${#SIGNING_KEY_ALIAS} -> ${#alias_clean}). Re-save the secret without extra spaces or line breaks."
            fi
            echo "SIGNING_KEY_ALIAS=$alias_clean" >> "$GITHUB_ENV"
          else
            # Aliases are not secret: list them so a wrong SIGNING_KEY_ALIAS is easy to fix.
            aliases=$(keytool -list -keystore "$SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" 2>/dev/null \
                      | grep -E 'PrivateKeyEntry|trustedCertEntry' | cut -d, -f1 | tr '\n' ' ')
            echo "::error title=The signing key could not be opened::$(tr '\n' ' ' < "$RUNNER_TEMP/keytool.txt" | cut -c1-200) The SIGNING_KEY_ALIAS secret is ${#SIGNING_KEY_ALIAS} characters long (${#alias_clean} after cleaning). Aliases in this keystore: ${aliases:-none found}. Set SIGNING_KEY_ALIAS to exactly one of them (see docs/RELEASING.md)."
            exit 1
          fi

      - name: Check the key password
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Only the right key password lets the key be copied out; this fails now, not after a 3 minute build.
          if ! keytool -importkeystore -noprompt \
                 -srckeystore "$SIGNING_STORE_FILE" -srcstorepass "$SIGNING_STORE_PASSWORD" \
                 -srcalias "$SIGNING_KEY_ALIAS" -srckeypass "$SIGNING_KEY_PASSWORD" \
                 -destkeystore "$RUNNER_TEMP/keycheck.p12" -deststoretype pkcs12 -deststorepass keycheck-only \
                 > "$RUNNER_TEMP/keycheck.txt" 2>&1; then
            echo "::error title=The key password is wrong::$(tr '\n' ' ' < "$RUNNER_TEMP/keycheck.txt" | cut -c1-200) Set SIGNING_KEY_PASSWORD to the key password (with a modern PKCS12 keystore it is the same as SIGNING_STORE_PASSWORD). See docs/RELEASING.md."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/keycheck.p12"

      - name: Build the release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # SIGNING_KEY_ALIAS comes from the key check above (the cleaned value).
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Put the reason where it shows on the run summary page, not only in the long log.
            reason=$(grep -E -A8 "What went wrong|^e: |error:" "$RUNNER_TEMP/build.log" | head -n 30 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=Gradle build failed::$reason"
          fi
          exit "$status"

      - name: Name the release and collect the files
        id: meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle || true)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error title=No versionName::Could not read versionName from app/build.gradle"
            exit 1
          fi
          SAFE_VERSION=${VERSION_NAME// /-}
          TAG="v${SAFE_VERSION}-build.${GITHUB_RUN_NUMBER}"
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK="ApkRepackerRevived-v${SAFE_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$APK_SRC" "$APK"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          # A plain number (1.0.4) is a stable release; beta/alpha/rc is a pre-release.
          case "$VERSION_NAME" in
            *beta*|*alpha*|*rc*|*RC*) echo "channel=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=--latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check the APK is signed
        env:
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Write the release notes
        env:
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Automatic build of \`main\` at \`${GITHUB_SHA::7}\`."
            echo
            echo "**SHA-256** \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo
            echo "### Changes"
            if [ -n "$PREVIOUS" ]; then
              git log "$PREVIOUS"..HEAD --no-merges --pretty='- %s (%h)' | head -n 40
            else
              git log -n 20 --no-merges --pretty='- %s (%h)'
            fi
          } > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.meta.outputs.apk }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          # Re-running a run reuses its tag: replace what is there instead of failing.
          gh release delete "$TAG" --cleanup-tag --yes > /dev/null 2>&1 || true
          gh release create "$TAG" "$APK" \
            --title "Apk Repacker Revived $VERSION_NAME (build $GITHUB_RUN_NUMBER)" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            "$CHANNEL"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keycheck.p12"
