// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
}

ext {
    compileSdkVersion = libs.versions.compileSdk.get().toInteger()
    minSdkVersion = libs.versions.minSdk.get().toInteger()
    targetSdkVersion = libs.versions.targetSdk.get().toInteger()
}

// apktool-lib depends on apktool's smali fork, which uses the same packages as Google's
// com.android.tools.smali artifacts (pulled in by jadx). Use the fork everywhere so there is
// exactly one copy of each class.
subprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            ['smali', 'smali-baksmali', 'smali-dexlib2', 'smali-util'].each { name ->
                substitute module("com.android.tools.smali:$name") using module("com.github.iBotPeaches.smali:$name:${libs.versions.apktoolSmali.get()}") because 'apktool-lib needs its smali fork'
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
