[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coroutines = "1.11.0"

compileSdk = "37"
minSdk = "23"
# Android 16. Shared storage access goes through MANAGE_EXTERNAL_STORAGE ("All files
# access") on API 30+; see utils/PermissionsUtils.kt and the manifest for the other
# target-SDK-dependent behavior (edge-to-edge, predictive back, FGS types, ...).
targetSdk = "36"

appcompat = "1.7.1"
annotation = "1.11.0"
recyclerview = "1.4.0"
material = "1.14.0"
smali = "3.0.10"
# apktool ships its own smali fork (same packages as com.android.tools.smali); see build.gradle.
apktool = "3.0.3"
apktoolSmali = "b6365a84f4"
jadx = "1.5.6"
apksig = "9.4.1"
junit = "4.13.2"
androidx-junit = "1.3.0"
espresso = "3.7.0"

[libraries]
# kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# androidx
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version = "1.9.1" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version = "1.2.1" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version = "1.1.0" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version = "1.1.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version = "1.2.0" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.11.0" }
androidx-lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version = "2.2.0" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version = "2.1.5" }

# smali / decompiler / signing
apktool-lib = { module = "org.apktool:apktool-lib", version.ref = "apktool" }
smali = { module = "com.android.tools.smali:smali", version.ref = "smali" }
smali-baksmali = { module = "com.android.tools.smali:smali-baksmali", version.ref = "smali" }
smali-dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version.ref = "smali" }
smali-util = { module = "com.android.tools.smali:smali-util", version.ref = "smali" }
jadx-core = { module = "io.github.skylot:jadx-core", version.ref = "jadx" }
jadx-dex-input = { module = "io.github.skylot:jadx-dex-input", version.ref = "jadx" }
jadx-smali-input = { module = "io.github.skylot:jadx-smali-input", version.ref = "jadx" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }

# utilities
guava = { module = "com.google.guava:guava", version = "33.7.2-android" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
# commons-io 2.7+ relies on java.nio.file, which only exists on API 26+.
# Core library desugaring (desugar_jdk_libs_nio) backports it, so the latest is usable.
commons-io = { module = "commons-io:commons-io", version = "2.22.0" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.21.0" }
antlr = { module = "org.antlr:antlr", version = "3.5.3" }
antlr-runtime = { module = "org.antlr:antlr-runtime", version = "3.5.3" }
glide = { module = "com.github.bumptech.glide:glide", version = "5.0.9" }
spinkit = { module = "com.github.ybq:Android-SpinKit", version = "1.4.0" }
fastscroll = { module = "me.zhanghai.android.fastscroll:library", version = "1.3.0" }
systemuihelper = { module = "me.zhanghai.android.systemuihelper:library", version = "1.0.0" }
materialprogressbar = { module = "me.zhanghai.android.materialprogressbar:library", version = "1.6.1" }
licensesdialog = { module = "de.psdev.licensesdialog:licensesdialog", version = "2.2.0" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
universal-image-loader = { module = "com.nostra13.universalimageloader:universal-image-loader", version = "1.9.5" }

# tests
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-rules = { module = "androidx.test:rules", version = "1.7.0" }

[bundles]
android-test = ["androidx-test-junit", "androidx-test-espresso"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 ships built-in Kotlin support; declaring KGP here only pins a newer compiler version.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
